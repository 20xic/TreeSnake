name: Build and Release

on:
  push:
    branches: [main]

# Один релизный прогон за раз: два быстрых пуша в main не должны
# одновременно бампать версию и создавать релиз.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  bump:
    # Автоинкремент версии по Conventional Commits: fix -> patch, feat -> minor,
    # BREAKING CHANGE -> major. Правит pyproject.toml и CHANGELOG.md, создаёт
    # коммит и тег v<version>, пушит в main. Пуш от GITHUB_TOKEN не запускает
    # workflow повторно, так что петли нет.
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      ref: ${{ steps.bump.outputs.ref }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install commitizen
        run: pip install "commitizen>=4.18.0,<5.0.0"

      - name: Bump version
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          set +e
          cz bump --yes --changelog
          rc=$?
          set -e

          # 3 = NO_COMMITS_FOUND, 21 = NO_INCREMENT (только chore/docs/... коммиты)
          if [ "$rc" -eq 3 ] || [ "$rc" -eq 21 ]; then
            echo "Nothing to bump"
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            exit 0
          elif [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi

          git push --follow-tags origin HEAD:main
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: bump
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        include:
          - os: windows-latest
            artifact: treesnake.exe
          - os: macos-latest
            artifact: treesnake-macos
          - os: ubuntu-latest
            artifact: treesnake-linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Build
        run: python build.py

      - name: Rename artifact (macOS/Linux)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: mv dist/treesnake dist/${{ matrix.artifact }}

      - name: Smoke test binary
        shell: bash
        run: |
          ./dist/${{ matrix.artifact }} version
          ./dist/${{ matrix.artifact }} scan src --fmt default --output stdout --only-tree > /dev/null

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    needs: [bump, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.ref }}

      - name: Read version from pyproject.toml
        id: version
        run: |
          VERSION=$(python3 -c "import tomllib; f=open('pyproject.toml','rb'); d=tomllib.load(f); print(d['project']['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Check if release already exists
        id: release_check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Download all artifacts
        if: steps.release_check.outputs.exists == 'false'
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create release and upload assets
        if: steps.release_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: treesnake ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/treesnake.exe/treesnake.exe
            dist/treesnake-macos/treesnake-macos
            dist/treesnake-linux/treesnake-linux
