[project]
name = "treesnake"
version = "0.5.1"
description = "TreeSnake — A utility for scanning and documenting project structure while preserving file contents."
authors = [
    {name = "twentyxic", email = "twenty.xic@yandex.ru"}
]
license = {text = "MIT License"}
requires-python = ">=3.12, <3.15"
dependencies = [
    "pydantic>=2.12.5,<3.0.0",
    "typer>=0.23.0,<0.24.0",
    "rich>=14.3.2,<15.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "pyyaml>=6.0.0,<7.0.0",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0.0,<7.0.0",
    "pytest>=9.0.0,<10.0.0",
    "ruff>=0.16.0,<0.17.0",
    "commitizen>=4.18.0,<5.0.0",
    "pre-commit>=4.0.0,<5.0.0",
]

[project.scripts]
treesnake = "cli.app:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
    { include = "cli", from = "src" },
    { include = "core", from = "src" },
    { include = "models", from = "src" },
    { include = "utils", from = "src" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["venv", "build", "dist", "src/cli/_version.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",   # line length is handled by the formatter
    "RUF001", "RUF002", "RUF003",  # cyrillic in strings/comments/docstrings
    "RUF012", # mutable class defaults are fine for pydantic models / constants
    "UP042",  # typer expects `str, Enum` for choice params
    "UP046",  # keep `Generic[T]` on ABC interfaces
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # assert False in tests

[tool.ruff.lint.isort]
known-first-party = ["cli", "core", "models", "utils"]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
version_scheme = "pep440"
tag_format = "v$version"
bump_message = "chore(release): bump version $current_version → $new_version"
update_changelog_on_bump = true
changelog_incremental = true
changelog_file = "CHANGELOG.md"
